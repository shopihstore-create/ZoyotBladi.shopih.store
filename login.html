<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion | ZoyotBladi</title><link rel="stylesheet" href="admin.css"><main class="login"><h1>ZoyotBladi</h1><p>Administration</p><form id="login"><label>Email<input name="email" type="email" required></label><label>Mot de passe<input name="password" type="password" required></label><button>Connexion</button></form><p id="msg" role="status"></p><a href="index.html">Retour au magasin</a></main><script type="module">import {db} from './supabase.js';document.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){document.querySelector('#msg').textContent='Connexion impossible.';return;}location.href='admin.html';};</script></html>
